# P0 skeleton — сервис API появится на P5; volumes уже заложены.
services:
  api:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      - ./runs:/app/runs
      - ./cookies.rostender.txt:/app/cookies.rostender.txt:ro
      - ./app:/app/app
    # P0: заглушка; на P5 заменить на uvicorn
    command: ["python", "-c", "print('ndt-tender-scout P0 — docker compose skeleton OK')"]
