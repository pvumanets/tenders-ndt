services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scout}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scout}
      SCOUT_DOCS_DIR: /data/docs
      DOWNLOAD_DOCS: ${DOWNLOAD_DOCS:-0}
      SCOUT_WEB_DIST: /app/web-dist
      SCOUT_LEGACY_HTML: ${SCOUT_LEGACY_HTML:-1}
      ROSTENDER_COOKIES_FILE: /app/cookies.rostender.txt
      TENDER_PRO_COOKIES_FILE: /app/cookies.tender-pro.txt
      ROSELTORG_COOKIES_FILE: /app/cookies.roseltorg.txt
    volumes:
      - ./runs:/app/runs
      - ./cookies.rostender.txt:/app/cookies.rostender.txt:rw
      - ./cookies.tender-pro.txt:/app/cookies.tender-pro.txt:rw
      - ./cookies.roseltorg.txt:/app/cookies.roseltorg.txt:rw
      - docs_data:/data/docs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  pg_data:
  docs_data:
