# VPS prod: Caddy on 80/443 (HTTPS). API/Postgres stay on loopback.
# docker compose -f docker-compose.prod.yml up -d --build
# Public Scout login only via https://tenders.ndtexam.ru — never 0.0.0.0:8765.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scout}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scout}
      SCOUT_DOCS_DIR: /data/docs
      DOWNLOAD_DOCS: ${DOWNLOAD_DOCS:-0}
      SCOUT_WEB_DIST: /app/web-dist
      SCOUT_LEGACY_HTML: ${SCOUT_LEGACY_HTML:-1}
      ROSTENDER_COOKIES_FILE: /app/cookies.rostender.txt
      TENDER_PRO_COOKIES_FILE: /app/cookies.tender-pro.txt
      SCOUT_COOKIE_SECURE: "1"
    volumes:
      - ./runs:/app/runs
      - ./cookies.rostender.txt:/app/cookies.rostender.txt:ro
      - ./cookies.tender-pro.txt:/app/cookies.tender-pro.txt:ro
      - docs_data:/data/docs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  docs_data:
  caddy_data:
  caddy_config:
